name: Android app check

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-check.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-check.yml"
  workflow_dispatch:

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Expo configuration
        run: npx expo config --type public
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist-android
